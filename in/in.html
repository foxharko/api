<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram • Харко</title>

<style>

/* =========================================================
   БАЗА
========================================================= */

html,
body{
    margin:0;
    padding:0;
    background:transparent;
}

*{
    box-sizing:border-box;
}

.instagram-box{
    width:330px;
    height:650px;

    margin:0 auto;

    position:relative;

    overflow:hidden;

    border-radius:18px;

    background:#0d0d0d;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}


/* =========================================================
   ОБКЛАДИНКА
========================================================= */

.instagram-cover-btn{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    border:0;

    cursor:pointer;
    overflow:hidden;

    background-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.00),
            rgba(0,0,0,.10)
        ),
        url("./fox_harko_instagram_cover_330x650.png"),
        linear-gradient(
            135deg,
            #833ab4 0%,
            #c13584 30%,
            #e1306c 55%,
            #fd1d1d 72%,
            #f77737 88%,
            #fcaf45 100%
        );

    background-size:
        cover,
        cover,
        cover;

    background-position:
        center,
        center,
        center;

    background-repeat:
        no-repeat,
        no-repeat,
        no-repeat;

    background-color:#833ab4;

    z-index:10;
}


/* =========================================================
   КНОПКА "ПОКАЗАТИ INSTAGRAM"
========================================================= */

.instagram-cover-label{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:82%;
    max-width:260px;

    padding:13px 16px;

    border:
        2px solid rgba(255,255,255,.97);

    border-radius:13px;

    background:
        linear-gradient(
            90deg,
            rgba(131,58,180,.96),
            rgba(225,48,108,.96),
            rgba(247,119,55,.96)
        );

    color:#fff;

    text-align:center;

    font-size:16px;
    font-weight:900;

    letter-spacing:.2px;

    text-shadow:
        0 2px 5px rgba(0,0,0,.58);

    box-shadow:
        0 7px 22px rgba(0,0,0,.40),
        0 0 0 2px rgba(255,255,255,.10);

    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);

    transition:
        transform .18s,
        filter .18s,
        box-shadow .18s;
}

.instagram-cover-btn:hover
.instagram-cover-label{
    filter:brightness(1.08);

    box-shadow:
        0 8px 25px rgba(0,0,0,.45),
        0 0 16px rgba(225,48,108,.45);
}

.instagram-cover-btn:active
.instagram-cover-label{
    transform:
        translate(-50%,-50%)
        scale(.98);
}


/* =========================================================
   LOADER
========================================================= */

.instagram-loader{
    display:none;

    position:absolute;
    inset:0;

    z-index:11;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    gap:12px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #3f1362,
            #a41d66,
            #d65632
        );
}

.instagram-spinner{
    width:31px;
    height:31px;

    border:
        3px solid rgba(255,255,255,.28);

    border-top-color:#fff;

    border-radius:50%;

    animation:
        instagram-spin .75s
        linear infinite;
}

@keyframes instagram-spin{
    to{
        transform:rotate(360deg);
    }
}

.instagram-loader span{
    font-size:13px;
    font-weight:800;
}


/* =========================================================
   ОСНОВНИЙ ВІДЖЕТ
========================================================= */

.instagram-widget{
    position:absolute;
    inset:0;

    width:330px;
    height:650px;

    padding:
        0 8px 78px;

    overflow-x:hidden;
    overflow-y:auto;

    background:
        linear-gradient(
            180deg,
            #080808 0%,
            #111 45%,
            #070707 100%
        );

    opacity:0;
    visibility:hidden;

    transition:
        opacity .35s;

    z-index:5;

    scrollbar-width:thin;
    scrollbar-color:#555 #111;
}

.instagram-widget.show{
    opacity:1;
    visibility:visible;
}


/* =========================================================
   PROFILE HEADER
========================================================= */

.instagram-profile{
    position:sticky;

    top:0;

    z-index:20;

    margin:
        0 -8px 10px;

    padding:
        12px 11px 11px;

    background:
        rgba(12,12,12,.97);

    border-bottom:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 5px 15px rgba(0,0,0,.18);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.instagram-profile-main{
    display:flex;
    align-items:center;
    gap:9px;
}


/* =========================================================
   AVATAR
========================================================= */

.instagram-avatar-wrap{
    width:58px;
    height:58px;

    flex:
        0 0 58px;

    padding:2px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #feda75,
            #fa7e1e,
            #d62976,
            #962fbf,
            #4f5bd5
        );
}

.instagram-avatar-inner{
    width:100%;
    height:100%;

    padding:2px;

    border-radius:50%;

    background:#111;
}

.instagram-avatar{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    background:#222;
}


/* =========================================================
   PROFILE INFO
========================================================= */

.instagram-profile-info{
    min-width:0;
    flex:1;
}

.instagram-service{
    margin-bottom:3px;

    color:#aaa;

    font-size:9px;
    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.65px;
}

.instagram-username{
    overflow:hidden;

    color:#fff;

    font-size:17px;
    font-weight:900;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.instagram-profile-open{
    display:flex;

    align-items:center;
    justify-content:center;

    flex:
        0 0 auto;

    min-height:32px;

    padding:
        7px 9px;

    border-radius:9px;

    background:#0095f6;

    color:#fff;

    text-decoration:none;

    font-size:10px;
    font-weight:900;

    transition:
        background .18s,
        transform .18s;
}

.instagram-profile-open:hover{
    background:#168fe5;
}

.instagram-profile-open:active{
    transform:scale(.97);
}


/* =========================================================
   СТАТИСТИКА
========================================================= */

.instagram-stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:11px;
}

.instagram-stat{
    display:block;

    min-width:0;

    padding:
        7px 2px;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius:9px;

    background:
        rgba(255,255,255,.045);

    color:#fff;

    text-align:center;
    text-decoration:none;

    transition:
        background .18s,
        border-color .18s;
}

.instagram-stat:hover{
    background:
        rgba(255,255,255,.09);

    border-color:
        rgba(255,255,255,.18);
}

.instagram-stat-value{
    display:block;

    overflow:hidden;

    color:#fff;

    font-size:13px;
    font-weight:900;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.instagram-stat-label{
    display:block;

    margin-top:2px;

    color:#999;

    font-size:8.5px;

    line-height:1.1;
}


/* =========================================================
   ЗАКРІПЛЕНІ
========================================================= */

.instagram-pinned{
    margin:
        9px 0 13px;

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,.13);

    border-radius:13px;

    background:
        rgba(255,255,255,.035);

    box-shadow:
        0 4px 15px rgba(0,0,0,.17);
}

.instagram-pinned summary{
    position:relative;

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        11px 37px 11px 11px;

    cursor:pointer;

    list-style:none;
    user-select:none;

    color:#fff;

    background:
        linear-gradient(
            90deg,
            rgba(131,58,180,.20),
            rgba(225,48,108,.14),
            rgba(252,175,69,.10)
        );

    font-size:12px;
    font-weight:900;
}

.instagram-pinned
summary::-webkit-details-marker{
    display:none;
}

.instagram-pinned
summary::after{
    content:"▼";

    position:absolute;

    right:13px;
    top:50%;

    transform:
        translateY(-50%);

    color:#ccc;

    font-size:9px;

    transition:
        transform .18s;
}

.instagram-pinned[open]
summary::after{
    transform:
        translateY(-50%)
        rotate(180deg);
}

.instagram-pin-icon{
    display:flex;

    align-items:center;
    justify-content:center;

    width:25px;
    height:25px;

    flex:
        0 0 25px;

    border-radius:8px;

    background:
        rgba(255,255,255,.08);

    font-size:13px;
}

.instagram-pinned-title{
    min-width:0;
    flex:1;

    overflow:hidden;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.instagram-pinned-count{
    display:flex;

    align-items:center;
    justify-content:center;

    min-width:25px;
    height:25px;

    padding:
        0 6px;

    border-radius:20px;

    background:
        rgba(255,255,255,.10);

    color:#fff;

    font-size:10px;
    font-weight:900;
}

.instagram-pinned-content{
    padding:9px;
}

.instagram-no-pinned{
    padding:
        17px 12px;

    border-radius:9px;

    background:
        rgba(255,255,255,.035);

    color:#aaa;

    text-align:center;

    font-size:11px;
    line-height:1.4;
}


/* =========================================================
   НАЗВА БЛОКУ
========================================================= */

.instagram-section-title{
    display:flex;

    align-items:center;

    gap:7px;

    margin:
        10px 3px 8px;

    color:#fff;

    font-size:13px;
    font-weight:900;
}

.instagram-section-title::before{
    content:"";

    width:4px;
    height:18px;

    border-radius:5px;

    background:
        linear-gradient(
            to bottom,
            #feda75,
            #d62976,
            #4f5bd5
        );
}


/* =========================================================
   POSTS
========================================================= */

.instagram-posts{
    display:flex;

    flex-direction:column;

    gap:13px;
}

.instagram-post-card{
    position:relative;

    width:100%;

    overflow:hidden;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:13px;

    background:#fff;

    box-shadow:
        0 5px 18px rgba(0,0,0,.25);
}

.instagram-post-number{
    position:absolute;

    top:7px;
    left:7px;

    z-index:15;

    display:flex;

    align-items:center;
    justify-content:center;

    min-width:30px;
    height:29px;

    padding:
        0 7px;

    border:
        1px solid rgba(255,255,255,.26);

    border-radius:8px;

    background:
        rgba(0,0,0,.72);

    color:#fff;

    font-size:10px;
    font-weight:900;

    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
}

.instagram-post-link{
    display:flex;

    align-items:center;
    justify-content:center;

    min-height:100px;

    padding:18px;

    background:#fff;

    color:#333;

    text-decoration:none;

    text-align:center;

    font-size:12px;
    font-weight:800;
}

.instagram-media{
    min-width:0 !important;

    width:100% !important;
    max-width:100% !important;

    margin:0 !important;

    border:0 !important;
}


/* =========================================================
   EMPTY
========================================================= */

.instagram-empty{
    padding:
        24px 15px;

    border:
        1px dashed rgba(255,255,255,.16);

    border-radius:11px;

    background:
        rgba(255,255,255,.025);

    color:#999;

    text-align:center;

    font-size:11px;
    line-height:1.5;
}


/* =========================================================
   НИЖНЯ ЗАКРІПЛЕНА ПАНЕЛЬ
========================================================= */

.instagram-fixed-bottom{
    display:none;

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:30;

    padding:
        17px 10px 11px;

    background:
        linear-gradient(
            to top,
            rgba(8,8,8,1) 68%,
            rgba(8,8,8,.93) 82%,
            rgba(8,8,8,0)
        );

    pointer-events:none;
}

.instagram-fixed-bottom.show{
    display:block;
}

.instagram-bottom-link{
    display:flex;

    align-items:center;
    justify-content:center;

    width:100%;
    height:45px;

    border:
        1px solid rgba(255,255,255,.28);

    border-radius:11px;

    background:
        linear-gradient(
            90deg,
            #833ab4,
            #c13584,
            #e1306c,
            #fd1d1d,
            #f77737
        );

    color:#fff;

    text-decoration:none;

    font-size:12px;
    font-weight:900;

    box-shadow:
        0 5px 17px rgba(0,0,0,.35);

    pointer-events:auto;

    transition:
        filter .18s,
        transform .18s;
}

.instagram-bottom-link:hover{
    filter:brightness(1.1);
}

.instagram-bottom-link:active{
    transform:scale(.98);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:330px){

    .instagram-box,
    .instagram-widget{
        width:100vw;
    }

}

</style>
</head>

    /* =====================================================

    function escapeHTML(value){

        return String(
            value ?? ""
        )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

    }



    /* =====================================================

        );


    return `

        <div class="instagram-post-card">

            <blockquote
                class="instagram-media"
                data-instgrm-captioned
                data-instgrm-permalink="${permalink}"
                data-instgrm-version="14">

                <a
                    class="instagram-post-link"
                    href="${permalink}"
                    target="_blank"
                    rel="noopener noreferrer">

                    Відкрити публікацію
                    в Instagram

                </a>

            </blockquote>

        </div>

    `;

}



    /* =====================================================
       PROFILE
    ===================================================== */

    function renderProfile(){

        const profileUrl =
            INSTAGRAM_DATA.profileUrl;


        username.textContent =
            "@" +
            INSTAGRAM_DATA.username;


        profileOpen.href =
            profileUrl;


        bottomLink.href =
            profileUrl;


        postsStat.href =
            profileUrl;


        followersStat.href =
            profileUrl;


        followingStat.href =
            profileUrl;


        postsValue.textContent =
            INSTAGRAM_DATA.stats.posts ||
            "—";


        followersValue.textContent =
            INSTAGRAM_DATA.stats.followers ||
            "—";


        followingValue.textContent =
            INSTAGRAM_DATA.stats.following ||
            "—";


        /*
          Аватар завантажується
          тільки після кліку.
        */

        if(
            INSTAGRAM_DATA.avatarUrl
        ){

            avatar.src =
                INSTAGRAM_DATA.avatarUrl;

        }


        avatar.onerror =
            () => {

                avatar.onerror =
                    null;


                avatar.src =
                    "https://fox-harko.pp.ua/favicon.svg";

            };

    }



    /* =====================================================
       ЗАКРІПЛЕНІ
    ===================================================== */

    function renderPinned(){

        const items =
            Array.isArray(
                INSTAGRAM_DATA.pinned
            )
                ? INSTAGRAM_DATA.pinned
                : [];


        pinnedCount.textContent =
            items.length;


        if(
            items.length === 0
        ){

            pinnedContent.innerHTML = `

                <div class="instagram-no-pinned">

                    Немає малюнків,
                    що закріплені.

                </div>

            `;


            return;

        }


        pinnedContent.innerHTML = `

            <div class="instagram-posts">

                ${
                    items
                        .map(
                            createPostHTML
                        )
                        .join("")
                }

            </div>

        `;

    }



    /* =====================================================
       СВІЖІ POSTS
    ===================================================== */

    function renderRecent(){

        const items =
            Array.isArray(
                INSTAGRAM_DATA.recent
            )
                ? INSTAGRAM_DATA.recent
                : [];


        if(
            items.length === 0
        ){

            recentContent.innerHTML = `

                <div class="instagram-empty">

                    Свіжі публікації
                    зараз не знайдені.

                    <br><br>

                    Перейди в Instagram,
                    щоб переглянути профіль.

                </div>

            `;


            return;

        }


        recentContent.innerHTML =
            items
                .map(
                    createPostHTML
                )
                .join("");

    }



    /* =====================================================
       INSTAGRAM EMBED SCRIPT

       До натискання кнопки
       embed.js не завантажується.
    ===================================================== */

    function loadInstagramScript(){

        return new Promise(
            resolve => {


                if(
                    instagramScriptLoaded
                ){

                    if(
                        window.instgrm
                        &&
                        window.instgrm.Embeds
                    ){

                        window.instgrm
                            .Embeds
                            .process();

                    }


                    resolve();

                    return;

                }


                instagramScriptLoaded =
                    true;


                const script =
                    document.createElement(
                        "script"
                    );


                script.async =
                    true;


                script.src =
                    "https://www.instagram.com/embed.js";


                script.onload =
                    () => {


                        if(
                            window.instgrm
                            &&
                            window.instgrm.Embeds
                        ){

                            window.instgrm
                                .Embeds
                                .process();

                        }


                        resolve();

                    };


                /*
                  Якщо Instagram не відповість,
                  сам віджет все одно відкриється.
                */

                script.onerror =
                    resolve;


                document.body
                    .appendChild(
                        script
                    );

            }
        );

    }



    /* =====================================================
       SHOW
    ===================================================== */

    function showWidget(){

        loader.style.display =
            "none";


        widget.classList.add(
            "show"
        );


        fixedBottom.classList.add(
            "show"
        );

    }



    /* =====================================================
       LOAD BUTTON
    ===================================================== */

    loadBtn.addEventListener(
        "click",
        async event => {


            event.preventDefault();

            event.stopPropagation();


            if(loaded){
                return;
            }


            loaded =
                true;


            /*
              Прибираємо обкладинку.
            */

            loadBtn.style.display =
                "none";


            /*
              Loader.
            */

            loader.style.display =
                "flex";


            /*
              Спочатку створюємо
              локальний інтерфейс.
            */

            renderProfile();

            renderPinned();

            renderRecent();


            /*
              Показуємо UI,
              не чекаючи повного
              завантаження Instagram.
            */

            setTimeout(
                showWidget,
                250
            );


            /*
              І лише після кліку
              підключаємо Instagram.
            */

            await loadInstagramScript();


            showWidget();

        }
    );


})();
</script>

</html>
